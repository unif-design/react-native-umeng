[pr_reviewer]
extra_instructions = """
用中文 code review。除了 org 级通用规则,本仓库特有规则:
- TurboModule spec(NativeUmengCommon/Share/Analytics)签名改动必须 JS spec
  + iOS .mm + Android .kt 三端同步,否则 codegen 出来的 Native*Spec 跟实现
  不一致,iOS / Android example app 编译会挂(Unresolved reference / 协议
  实现不全)
- PIPL 合规硬约束:JS Common.init() 之前桥不调任何友盟 API。新增 native
  方法不能在 Module init / preInit 里直接采集上报,只允许 UMConfigure.preInit
  这种"不上报"调用
- 错误码必须走 src/types.ts 的 ErrorCode 枚举(E_PLATFORM_NOT_INSTALLED /
  E_USER_CANCEL / E_SHARE_FAILED 等),不要在 share.ts 里直接抛 message
  字串。新错误码必须同时改类型 + README 错误码表
- iOS 友盟拼写遵循 SDK 原始错误:setPlaform(少一个 t)、UMSocialPlatformType
  .dingDing(驼峰),不要"修正"
- Android U-Share 必须走 Activity.runOnUiThread —— UMShareAPI.get(activity)
  .share 不能在 JS thread / 非 main thread 调,会抛 RuntimeException
- WeChat/DingTalk SDK 在 friend pod 上不传递依赖,podspec / build.gradle
  显式列 wechat-sdk-android 6.8.34 / ddsharesdk 1.2.2,移除依赖前确认
  友盟 SDK 版本兼容矩阵
- ShareSheet UI 走 @unif/react-native-design 的 BottomSheet/Cell/Button,
  不要绕开 design token 自定义 surface 颜色;新平台 leading tile 用
  PLATFORM_BRAND_COLORS
- 必须 conventional commits 前缀(feat / fix / chore / docs / test / refactor / ci)
"""

[pr_code_suggestions]
extra_instructions = "用中文,引用具体行号,给可落地的代码改进(不要给\"考虑重构\"这种空泛建议)。"

[pr_description]
extra_instructions = "用中文,1-2 句概括 + 列变更点。如果有 BREAKING CHANGE 必须在 body 显式标注。"
