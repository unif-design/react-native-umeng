name: Project Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      javascript: ${{ steps.scope.outputs.js == 'true' || steps.scope.outputs.shared == 'true' || steps.scope.outputs.example == 'true' || steps.scope.outputs.tooling == 'true' }}
      consumer: ${{ steps.scope.outputs.js == 'true' || steps.scope.outputs.shared == 'true' || steps.scope.outputs.ios == 'true' || steps.scope.outputs.android == 'true' || steps.scope.outputs.tooling == 'true' }}
      website: ${{ steps.scope.outputs.website == 'true' || steps.scope.outputs.tooling == 'true' }}
      instructions: ${{ steps.scope.outputs.instructions == 'true' || steps.scope.outputs.tooling == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Select affected checks
        id: scope
        uses: ./.github/actions/changes

  javascript:
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run example tests
        run: yarn example test --maxWorkers=2

      - name: Verify example contract
        run: yarn verify:example-contract

  consumer:
    needs: changes
    if: needs.changes.outputs.consumer == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare package
        run: yarn prepare

      - name: Test release validation tooling
        run: yarn verify:release-validation

      - name: Verify dependencies
        run: yarn verify:dependencies

      - name: Verify package contents
        run: yarn verify:package

      - name: Verify isolated consumer
        run: yarn verify:consumers

      - name: Verify publish contract
        env:
          SQUASH_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -n "$SQUASH_TITLE" ]; then
            yarn verify:publish-contract --squash-title "$SQUASH_TITLE"
          else
            yarn verify:publish-contract
          fi

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify dependencies
        run: yarn verify:dependencies

      - name: Verify example contract
        run: yarn verify:example-contract

  instructions:
    needs: changes
    if: needs.changes.outputs.instructions == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      # Task 13 提供稳定脚本；本 workflow 与其同一交付分支合并后启用。
      - name: Verify Agent instructions
        run: yarn verify:agent-instructions

  validation:
    if: always()
    needs:
      - changes
      - javascript
      - consumer
      - website
      - instructions
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.JOB_RESULTS);
            const invalid = [];
            const changes = jobs.changes;
            if (changes?.result !== "success") {
              invalid.push(["changes", changes?.result ?? "missing", "success"]);
            }
            for (const name of [
              "javascript",
              "consumer",
              "website",
              "instructions",
            ]) {
              const expected =
                changes?.outputs?.[name] === "true" ? "success" : "skipped";
              const actual = jobs[name]?.result ?? "missing";
              if (actual !== expected) {
                invalid.push([name, actual, expected]);
              }
            }
            if (invalid.length > 0) {
              console.error(
                invalid
                  .map(
                    ([name, actual, expected]) =>
                      name + ": " + actual + " (expected " + expected + ")"
                  )
                  .join("\n")
              );
              process.exit(1);
            }
            console.log("All selected project validation jobs passed.");
          '
